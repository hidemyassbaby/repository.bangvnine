name: Update Wayne Backgrounds

on:
  schedule:
    - cron: '0 11 */2 * *'  # Midnight NZDT or 11:00 pm NZST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wayne-backgrounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow

      - name: Run Wayne background update
        run: python update_wayne_backgrounds.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes were made."
          else
            git commit -m "Auto: Update Wayne backgrounds and compress images"
            git push
          fi