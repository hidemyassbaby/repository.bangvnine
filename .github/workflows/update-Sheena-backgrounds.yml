name: Update Sheena Backgrounds

on:
  schedule:
    - cron: '0 12 */3 * *'  # Every third calendar day at 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sheena-backgrounds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install image resizing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests Pillow

      - name: Run Sheena background updater
        run: python update_sheena_backgrounds.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes were made."
          else
            git commit -m "Auto: Update Sheena backgrounds and bump version"
            git push
          fi